
name: Build UNDERTUNE VST3 (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compile VST3
        run: cmake --build build --config Release --target UNDERTUNE_VST3

      - name: Upload VST3 plugin
        uses: actions/upload-artifact@v4
        with:
          name: UNDERTUNE-Windows-VST3
          path: build/UNDERTUNE_artefacts/Release/VST3/UNDERTUNE.vst3
          if-no-files-found: error
